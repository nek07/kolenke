<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kolenke — вход</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F2;--surface:#FFF;--ink:#141414;--ink-2:#4A4A48;--muted:#8A8A85;--line:#E4E3DE;--accent:#FFD43B;--red:#E0463C;--red-soft:#FDEBEA;--sans:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--surface:#1B1B1B;--ink:#F2F2EF;--ink-2:#C4C4BF;--muted:#8C8C87;--line:#2E2E2C;--red:#FF7B72;--red-soft:rgba(255,123,114,.14)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);padding:24px 16px}
.box{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);border:1.5px solid #141414;display:grid;place-items:center}
.brand b{font-weight:800;font-size:22px;letter-spacing:-.02em}
h1{font-weight:800;font-size:28px;letter-spacing:-.03em;margin:0 0 6px}
p.sub{color:var(--ink-2);margin:0 0 24px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
input:focus{outline:none;border-color:var(--ink)}
button{width:100%;margin-top:22px;padding:12px;border-radius:12px;border:1.5px solid #141414;background:var(--accent);color:#141414;font:700 15px var(--sans);cursor:pointer;box-shadow:2px 2px 0 #141414}
button:active{transform:translate(2px,2px);box-shadow:none}
button:disabled{opacity:.6}
.err{display:none;margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:14px}
.switch{margin-top:20px;color:var(--muted);font-size:14px}
.switch a{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main class="box">
  <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="7" width="17" height="13" rx="4.5" stroke="#141414" stroke-width="2"/><circle cx="9.5" cy="13.5" r="1.5" fill="#141414"/><circle cx="14.5" cy="13.5" r="1.5" fill="#141414"/><path d="M12 7V4" stroke="#141414" stroke-width="2" stroke-linecap="round"/></svg></div><b>kolenke</b></div>
  <h1 id="title">Вход</h1>
  <p class="sub" id="sub">Панель управления вашим агентом поиска работы</p>
  <form id="f" autocomplete="on">
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required minlength="8">
    <div id="invbox" hidden><label for="invite">Код приглашения</label><input id="invite" placeholder="XXXX-XXXX-XXXX" autocomplete="off"></div>
    <button id="go" type="submit">Войти</button>
    <div class="err" id="err"></div>
  </form>
  <p class="switch" id="sw"></p>
</main>
<script>
const reg = location.pathname === '/register', $ = s => document.querySelector(s);
if (reg) {
  $('#title').textContent = 'Регистрация'; $('#sub').textContent = 'kolenke пока работает по приглашениям. Код даёт владелец панели';
  $('#invbox').hidden = false; $('#go').textContent = 'Создать аккаунт'; $('#password').autocomplete = 'new-password';
  $('#invite').value = new URLSearchParams(location.search).get('invite') || '';
}
$('#sw').innerHTML = reg ? 'Уже есть аккаунт? <a href="/login">Войти</a>' : 'Есть приглашение? <a href="/register">Зарегистрироваться</a>';
$('#f').addEventListener('submit', async e => {
  e.preventDefault(); $('#err').style.display = 'none'; $('#go').disabled = true;
  const body = {email: $('#email').value, password: $('#password').value, invite: $('#invite').value};
  try {
    const r = await fetch(reg ? '/auth/register' : '/auth/login', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-JobBot': '1'}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || 'Не получилось, попробуйте ещё раз');
    location.href = '/';
  } catch (ex) { $('#err').textContent = ex.message; $('#err').style.display = 'block'; $('#go').disabled = false; }
});
</script>
</body>
</html>
